.caption{font-size:12px;line-height:1.7;color:var(--muted);margin:16px 0}.tokens{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.token{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:10px;line-height:1.7}.swatch{height:9px;border-radius:5px;margin-bottom:8px}.token strong{font-weight:550}.token span{display:block;color:var(--muted);font-size:9px}
.note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:14px}
@media(max-width:500px){.views button{font-size:11px;padding:7px 9px}.canvas.pair{gap:10px}.panel{padding:10px}.panel-label{font-size:8px}.tokens{grid-template-columns:1fr 1fr}}

 link anterior.\u003c/p>\u003ch3 class=\"editor-section\">\u003cspan>01\u003c/span> Cliente\u003c/h3>\u003clabel>Usar cliente cadastrado\u003cselect aria-label=\"Usar cliente cadastrado\">\u003coption value=\"\">Informar novo cliente\u003c/option>\u003coption value=\"e0b9dacc-b733-44dc-9936-987ef9d5cc86\">AUDITORIA ZOD — Clínica Horizonte com nome extenso\u003c/option>\u003coption value=\"be76be56-c430-4968-b8c9-5adf9b27caa7\">Ateliê Oliveira\u003c/option>\u003coption value=\"65a00ab2-802a-40f9-9297-4183f004ce8f\">Casa do Bosque\u003c/option>\u003coption value=\"38d0c6b2-6c2a-426a-8616-7b3a7805dded\">Cliente Demonstração A\u003c/option>\u003coption value=\"5d9967ee-d043-4ec2-a5ef-8d0fdd1d4ce6\">Clínica Costa Verde\u003c/option>\u003coption value=\"d024823d-7e39-4928-abec-0be2618fc979\">ZOD P1 — Rascunho protegido\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"muted\">Dados do cadastro selecionado. Para corrigir nome ou contato, use a aba Clientes; os dados atuais serão consultados ao publicar.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_8_\">Cliente\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Cliente\" aria-expanded=\"false\" aria-controls=\"_r_8_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_8_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Use o nome de quem receberá a proposta. Exemplo: Cliente Demonstração A. Confira antes de publicar: a versão enviada preserva esse nome.\u003c/div>\u003cinput required=\"\" minlength=\"2\" maxlength=\"120\" id=\"_r_8_\" value=\"Clínica Costa Verde\" readonly=\"\">\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_9_\">Contato (opcional)\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Contato (opcional)\" aria-expanded=\"false\" aria-controls=\"_r_9_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_9_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Anote um telefone ou e-mail para sua organização. Este campo não dispara mensagens e não aparece no portal público.\u003c/div>\u003cinput maxlength=\"160\" id=\"_r_9_\" value=\"demonstracao@example.invalid\" readonly=\"\">\u003c/div>\u003c/div>\u003ch3 class=\"editor-section\">\u003cspan>02\u003c/span> Serviços e materiais\u003c/h3>\u003cdiv class=\"item\">\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_a_\">Descrição\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Descrição (item 1)\" aria-expanded=\"false\" aria-controls=\"_r_a_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_a_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Descreva o serviço e o que está incluído. Exemplo: higienização de uma unidade split. Evite termos que o cliente não conhece.\u003c/div>\u003cinput required=\"\" maxlength=\"200\" id=\"_r_a_\" value=\"Higienização de ar-condicionado\">\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_b_\">Quantidade\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Quantidade (item 1)\" aria-expanded=\"false\" aria-controls=\"_r_b_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_b_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Informe um número inteiro de unidades, entre 1 e 1.000. Exemplo: 2 aparelhos. O subtotal é quantidade × valor unitário.\u003c/div>\u003cinput min=\"1\" max=\"1000\" required=\"\" id=\"_r_b_\" type=\"number\" value=\"1\">\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_c_\">Valor unitário (R$)\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Valor unitário (R$) (item 1)\" aria-expanded=\"false\" aria-controls=\"_r_c_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_c_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Informe o preço de uma Clínica Horizonte com nome extenso\u003c/option>\u003coption value=\"be76be56-c430-4968-b8c9-5adf9b27caa7\">Ateliê Oliveira\u003c/option>\u003coption value=\"65a00ab2-802a-40f9-9297-4183f004ce8f\">Casa do Bosque\u003c/option>\u003coption value=\"38d0c6b2-6c2a-426a-8616-7b3a7805dded\">Cliente Demonstração A\u003c/option>\u003coption value=\"5d9967ee-d043-4ec2-a5ef-8d0fdd1d4ce6\">Clínica Costa Verde\u003c/option>\u003coption value=\"d024823d-7e39-4928-abec-0be2618fc979\">ZOD P1 — Rascunho protegido\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"muted\">Dados do cadastro selecionado. Para corrigir nome ou contato, use a aba Clientes; os dados atuais serão consultados ao publicar.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_8_\">Cliente\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Cliente\" aria-expanded=\"false\" aria-controls=\"_r_8_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_8_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Use o nome de quem receberá a proposta. Exemplo: Cliente Demonstração A. Confira antes de publicar: a versão enviada preserva esse nome.\u003c/div>\u003cinput required=\"\" minlength=\"2\" maxlength=\"120\" id=\"_r_8_\" value=\"Clínica Costa Verde\" readonly=\"\">\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_9_\">Contato (opcional)\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Contato (opcional)\" aria-expanded=\"false\" aria-controls=\"_r_9_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_9_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Anote um telefone ou e-mail para sua organização. Este campo não dispara mensagens e não aparece no portal público.\u003c/div>\u003cinput maxlength=\"160\" id=\"_r_9_\" value=\"demonstracao@example.invalid\" readonly=\"\">\u003c/div>\u003c/div>\u003ch3 class=\"editor-section\">\u003cspan>02\u003c/span> Serviços e materiais\u003c/h3>\u003cdiv class=\"item\">\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_a_\">Descrição\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Descrição (item 1)\" aria-expanded=\"false\" aria-controls=\"_r_a_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_a_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Descreva o serviço e o que está incluído. Exemplo: higienização de uma unidade split. Evite termos que o cliente não conhece.\u003c/div>\u003cinput required=\"\" maxlength=\"200\" id=\"_r_a_\" value=\"Higienização de ar-condicionado\">\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_b_\">Quantidade\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Quantidade (item 1)\" aria-expanded=\"false\" aria-controls=\"_r_b_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_b_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Informe um número inteiro de unidades, entre 1 e 1.000. Exemplo: 2 aparelhos. O subtotal é quantidade × valor unitário.\u003c/div>\u003cinput min=\"1\" max=\"1000\" required=\"\" id=\"_r_b_\" type=\"number\" value=\"1\">\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_c_\">Valor unitário (R$)\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Valor unitário (R$) (item 1)\" aria-expanded=\"false\" aria-controls=\"_r_c_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_c_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Informe o preço de uma unidade em reais. Exemplo: 180,00 por aparelho. O total mostrado considera todos os itens; não há cobrança automática.\u003c/div>\u003cinput min=\"0\" max=\"1000000\" step=\"0.01\" required=\"\" id=\"_r_c_\" type=\"number\" value=\"180\">\u003c/div>\u003cbutton type=\"button\" class=\"secondary small\" disabled=\"\" aria-label=\"Remover item 1\">Remover\u003c/button>\u003c/div>\u003cbutton type=\"button\" class=\"secondary small\">+ Adicionar item\u003c/button>\u003ch3 class=\"editor-section\">\u003cspan>03\u003c/span> Condições da proposta\u003c/h3>\u003cdiv class=\"row\">\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_d_\">Validade (dias)\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Validade (dias)\" aria-expanded=\"false\" aria-controls=\"_r_d_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_d_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Prazo de 1 a 90 dias a partir da publicação. Depois do vencimento, o cliente não pode usar o link para aprovar. Publique nova revisão para renovar.\u003c/div>\u003cinput required=\"\" min=\"1\" max=\"90\" id=\"_r_d_\" type=\"number\" value=\"7\">\u003c/div>\u003cstrong class=\"total\">R$&nbsp;180,00\u003c/strong>\u003c/div>\u003cdiv class=\"help-field\">\u003cdiv class=\"field-heading\">\u003clabel for=\"_r_e_\">Condições\u003c/label>\u003cbutton type=\"button\" class=\"help-trigger\" aria-label=\"Ajuda: Condições\" aria-expanded=\"false\" aria-controls=\"_r_e_-help\">?\u003c/button>\u003c/div>\u003cdiv id=\"_r_e_-help\" class=\"help-note\" hidden=\"\" role=\"note\">Explique inclusões, exclusões e como combinar execução e pagamento. Exemplo: materiais adicionais sujeitos a novo orçamento. O cliente verá este texto.\u003c/div>\u003ctextarea maxlength=\"2000\" id=\"_r_e_\">Serviço sujeito à avaliação técnica. Valores e condições válidos pelo prazo indicado.\u003c/textarea>\u003c/div>\u003c/div>\u003csection class=\"quote-summary\" aria-label=\"Resumo da proposta\">\u003cspan class=\"eyebrow\">Resumo da proposta\u003c/span>\u003ch3>Clínica Costa Verde\u003c/h3>\u003cp>Confira os detalhes antes de publicar.\u003c/p>\u003cdl>\u003cdiv>\u003cdt>Itens na proposta\u003c/dt>\u003cdd>1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Validade\u003c/dt>\u003cdd>7 dias\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"summary-total\">\u003cspan>Valor total\u003c/span>\u003cstrong>R$&nbsp;180,00\u003c/strong>\u003c/div>\u003cp class=\"summary-assurance\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"brisa-icon \" aria-hidden=\"true\">\u003cpath d=\"M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6l-9-4M8 12l3 3 5-6\">\u003c/path>\u003c/svg> Publicar preserva esta revisão. Nenhuma cobrança é realizada.\u003c/p>\u003c/section>\u003c/div>\u003cdiv class=\"form-actions\">\u003cbutton class=\"secondary\" type=\"button\">Voltar\u003c/button>\u003cbutton type=\"button\" class=\"secondary\">Salvar rascunho\u003c/button>\u003cbutton>Publicar e gerar link\u003c/button>\u003c/div>\u003c/form>\u003cnav class=\"mobile-taskbar\" aria-label=\"Navegação rápida\">\u003cbutton aria-current=\"page\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"brisa-icon \" aria-hidden=\"true\">\u003cpath d=\"M8 3h8l4 4v14H4V3h4m8 0v5h5M8 12h8M8 16h5\">\u003c/path>\u003c/svg>\u003cspan>Propostas\u003c/span>\u003c/button>\u003cbutton>\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"brisa-icon \" aria-hidden=\"true\">\u003cpath d=\"M9 5H5v16h14V5h-4M9 3h6v4H9zM8 13l2 2 5-5\">\u003c/path>\u003c/svg>\u003cspan>Serviços\u003c/span>\u003c/button>\u003cbutton>\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"brisa-icon \" aria-hidden=\"true\">\u003cpath d=\"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2M8 14h2M14 14h2M8 18h2\">\u003c/path>\u003c/svg>\u003cspan>Agenda\u00
